<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CRM Zayvon · Demanda Infinita</title>
<style>
:root{
  --bg:#eef4f8; --card:#fff; --ink:#0b1b2b; --mute:#64748b; --line:#dbe4ec;
  --pri:#0b66d6; --pri-2:#06b6d4; --pri-soft:#e6f1fd; --navy:#0a2540;
  --g:#0f9d3a; --g-soft:#e3f3e8; --red:#c0392b; --red-soft:#fdeaea; --amber:#b45309; --amber-soft:#fff3dc;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px}
.btn:hover{background:#f3f7fa}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#0954b0}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
label{display:block;font-size:11.5px;color:var(--mute)}
label input,label select,label textarea{margin-top:3px;color:var(--ink);font-size:13.5px}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,var(--navy),#0b66d6 70%,#06b6d4)}
#login form{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:360px;display:grid;gap:12px}
#login h1{margin:0;font-size:20px}
#login p{margin:0;color:var(--mute);font-size:13px}
.err{color:var(--red);font-size:12.5px;min-height:16px}
/* app */
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header .logo{font-weight:700;letter-spacing:.02em}
header .logo span{color:var(--pri-2)}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav button{background:transparent;border:0;color:#b9cbe0;padding:7px 12px;border-radius:8px}
nav button.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.right{display:flex;align-items:center;gap:10px}
.bell{position:relative;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:6px 10px}
.bell b{position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;font-size:10px;border-radius:99px;padding:1px 6px}
.who{font-size:12px;color:#b9cbe0}
main{padding:14px 16px;max-width:1500px;margin:0 auto}
.warn{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}
.bar-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar-top input{max-width:340px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;font-size:12.5px;color:var(--mute)}
.kpis b{color:var(--ink)}
/* kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:none;width:262px;background:#e3ecf3;border-radius:12px;padding:8px;min-height:140px}
.col.over{outline:2px dashed var(--pri)}
.col h3{margin:2px 4px 8px;font-size:12.5px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.05em;color:#334155}
.col h3 span{font-weight:500;color:var(--mute)}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kc:hover{border-color:var(--pri)}
.kc b{display:block;font-size:13.5px}
.kc small{color:var(--mute);font-size:11.5px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:10.5px;background:var(--pri-soft);color:var(--pri);border-radius:6px;padding:1px 7px}
.score{float:right;font-size:11px;font-weight:700;color:#fff;background:var(--pri);border-radius:99px;padding:1px 8px}
.kc .val{font-size:11.5px;color:var(--g);font-weight:600;margin-top:4px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,37,64,.5);display:none;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;z-index:20}
.ov.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:860px;width:100%;padding:18px}
.modal h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.sec{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.sec h4{margin:0 0 8px;font-size:13px}
.li{font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li small{color:var(--mute)}
.pts{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
/* metas */
.funnel{display:grid;gap:10px;justify-items:center;margin:14px 0}
.fr{height:46px;border:2px solid var(--g);border-radius:10px;position:relative;overflow:hidden;background:#fff}
.fr i{position:absolute;inset:0 auto 0 0;background:var(--g);opacity:.9}
.fr span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:600;mix-blend-mode:normal}
.fr span em{font-style:normal;background:rgba(255,255,255,.85);border-radius:6px;padding:0 6px}
.big{font-size:30px;font-weight:700}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
/* whatsapp */
.wa{display:grid;grid-template-columns:300px 1fr;gap:12px;min-height:420px}
.wl{max-height:560px;overflow:auto}
.wi{padding:9px;border-bottom:1px solid var(--line);cursor:pointer}
.wi:hover,.wi.on{background:var(--pri-soft)}
.wi small{color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{display:flex;flex-direction:column;gap:6px;max-height:460px;overflow:auto;padding:6px;background:#f1f5f9;border-radius:10px}
.m{max-width:75%;padding:7px 10px;border-radius:10px;font-size:13px;white-space:pre-wrap}
.m.in{background:#fff;align-self:flex-start}
.m.out{background:#d6f0ff;align-self:flex-end}
.m small{display:block;color:var(--mute);font-size:10px}
/* sino */
#bellbox{position:absolute;right:16px;top:54px;width:340px;max-width:calc(100vw - 24px);background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:10px;z-index:30}
.tabs2{display:flex;gap:6px;margin-bottom:6px}
.tabs2 button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 12px;font-size:12px}
.tabs2 button.on{background:var(--navy);color:#fff}
.av{padding:7px 4px;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;gap:6px;justify-content:space-between}
.av.lido{opacity:.5}
/* confete */
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:99;animation:cai 2.2s linear forwards}
@keyframes cai{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:10px;z-index:99;display:none;max-width:90vw}
iframe{width:100%;height:calc(100vh - 110px);border:0;border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--mute);text-transform:uppercase}
@media(max-width:820px){.row2,.wa{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login">
  <form id="lf">
    <h1>CRM Zayvon</h1>
    <p>Entre com o e-mail e a senha que o dono criou para você.</p>
    <label>E-mail<input id="le" type="email" autocomplete="username" required></label>
    <label>Senha<input id="lp" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lerr"></div>
    <button class="btn pri" type="submit">Entrar</button>
  </form>
</div>

<div id="app" class="hide">
  <header>
    <div class="logo">Zayvon <span>CRM</span></div>
    <nav id="nav"></nav>
    <div class="right">
      <button class="bell" id="bell" title="Avisos">🔔<b id="bn" class="hide">0</b></button>
      <span class="who" id="who"></span>
      <button class="btn" id="out" style="padding:4px 10px">Sair</button>
    </div>
    <div id="bellbox" class="hide"></div>
  </header>
  <main>
    <div id="alert" class="warn hide"></div>

    <section id="t-crm">
      <div class="bar-top">
        <input id="q" placeholder="Buscar por nome, e-mail, telefone ou cargo…">
        <button class="btn pri" id="novo">+ Novo card</button>
        <button class="btn" id="rec">Atualizar</button>
        <div class="kpis" id="kp"></div>
      </div>
      <div class="board" id="board"></div>
    </section>

    <section id="t-metas" class="hide"></section>

    <section id="t-wa" class="hide"></section>

    <section id="t-ia" class="hide"><iframe src="ia-sdr.html" title="IA SDR"></iframe></section>

    <section id="t-chk" class="hide"></section>
  </main>
</div>

<div class="ov" id="ov"><div class="modal" id="md"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const VERSAO="1.0.0";
const SB_URL="https://wwislsbfwlijcohncjlz.supabase.co";
const SB_KEY="sb_publishable_eKcqSgZkTZs-TfdCoxvydg_3ExNMbVr"; // chave PÚBLICA. A secreta nunca entra aqui.
const sb=supabase.createClient(SB_URL,SB_KEY);

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const brl=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fdt=d=>d?new Date(d).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",3500)}

const S={me:null,perfil:null,etapas:[],cards:[],perfis:[],reunioes:[],lidos:new Set(),msgs:[],hist:[],metaMes:null,mtr:null,filtro:"",bellTab:"geral",waCard:null,tab:"crm"};
const podeEditar=()=>S.perfil&&["dono","closer"].includes(S.perfil.papel);
const etapaPorChave=k=>S.etapas.find(e=>e.chave===k);

/* ============ LOGIN ============ */
$("#lf").onsubmit=async e=>{
  e.preventDefault();$("#lerr").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:$("#le").value.trim(),password:$("#lp").value});
  if(error)$("#lerr").textContent="E-mail ou senha incorretos.";
};
$("#out").onclick=()=>sb.auth.signOut();
sb.auth.onAuthStateChange((_ev,session)=>{ if(session)start(session.user); else{ $("#app").classList.add("hide");$("#login").classList.remove("hide"); } });
sb.auth.getSession().then(({data})=>{ if(data.session)start(data.session.user); });

let started=false, poll;
async function start(user){
  S.me=user;
  $("#login").classList.add("hide");$("#app").classList.remove("hide");
  await loadAll();
  if(!started){started=true;buildNav();bind();}
  render();
  clearInterval(poll);poll=setInterval(()=>loadAll().then(render),60000);
  checarOntem();checarTour();
}

/* ============ DADOS ============ */
async function loadAll(){
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const h48=new Date(Date.now()-48*3600e3).toISOString();
  const mes=new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10);
  const r=await Promise.all([
    sb.from("perfis").select("*"),
    sb.from("etapas").select("*").order("ordem"),
    sb.from("cards").select("*").order("atualizado_em",{ascending:false}).limit(2000),
    sb.from("reunioes").select("*").gte("inicio",new Date(hoje-86400e3).toISOString()).order("inicio"),
    sb.from("avisos_lidos").select("chave").eq("user_id",S.me.id),
    sb.from("mensagens_whatsapp").select("*").order("criado_em",{ascending:false}).limit(400),
    sb.from("historico_card").select("*").eq("tipo","etapa").gte("criado_em",h48).order("criado_em",{ascending:false}).limit(200),
    sb.from("metas_mes").select("*").eq("mes",mes).maybeSingle(),
    sb.rpc("metricas_mes")
  ]);
  const erro=r.find(x=>x.error);
  if(erro){ $("#alert").textContent="Não consegui carregar os dados: "+erro.error.message+". Se as tabelas ainda não existem, rode o arquivo crm-banco.sql no Supabase."; $("#alert").classList.remove("hide"); }
  else $("#alert").classList.add("hide");
  S.perfis=r[0].data||[];S.perfil=S.perfis.find(p=>p.id===S.me.id)||null;
  S.etapas=r[1].data||[];S.cards=r[2].data||[];S.reunioes=r[3].data||[];
  S.lidos=new Set((r[4].data||[]).map(x=>x.chave));
  S.msgs=(r[5].data||[]).reverse();S.hist=r[6].data||[];
  S.metaMes=r[7].data;S.mtr=(r[8].data||[])[0]||null;
  $("#who").textContent=S.perfil?`${S.perfil.nome||S.me.email} · ${S.perfil.papel}`:S.me.email;
}
async function recarregar(){await loadAll();render()}

/* ============ NAV ============ */
const TABS=[["crm","CRM"],["metas","Metas"],["wa","WhatsApp"],["ia","IA SDR"],["chk","Checklist"]];
function buildNav(){
  $("#nav").innerHTML=TABS.map(([k,n])=>`<button data-k="${k}">${n}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>goTab(b.dataset.k));
}
function goTab(k){
  S.tab=k;
  TABS.forEach(([t])=>$("#t-"+t).classList.toggle("hide",t!==k));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  render();
}
function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===S.tab));
  TABS.forEach(([t])=>$("#t-"+t).classList.toggle("hide",t!==S.tab));
  ({crm:renderCrm,metas:renderMetas,wa:renderWa,ia(){},chk:renderChk})[S.tab]();
  renderBell();
}
function bind(){
  $("#q").oninput=e=>{S.filtro=norm(e.target.value);renderCrm()};
  $("#rec").onclick=recarregar;
  $("#novo").onclick=novoCard;
  $("#bell").onclick=()=>$("#bellbox").classList.toggle("hide");
  $("#ov").addEventListener("click",e=>{if(e.target.id==="ov")fechar()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")fechar()});
}
function abrir(html){$("#md").innerHTML=html;$("#ov").classList.add("open")}
function fechar(){$("#ov").classList.remove("open")}

/* ============ CRM: FUNIL EM COLUNAS ============ */
function donoNome(id){const p=S.perfis.find(x=>x.id===id);return p?(p.nome||p.email):""}
function renderCrm(){
  const f=S.filtro;
  const lista=S.cards.filter(c=>!f||[c.nome,c.email,c.telefone,c.cargo,c.empresa].some(v=>norm(v).includes(f)));
  const ult=S.cards.filter(c=>c.origem==="tally"||c.origem==="cal").map(c=>new Date(c.criado_em).getTime()).sort((a,b)=>b-a)[0];
  const dias=ult?Math.floor((Date.now()-ult)/864e5):null;
  const ultTxt=ult==null?"nenhum ainda":dias===0?"hoje":dias===1?"há 1 dia":`há ${dias} dias`;
  $("#kp").innerHTML=`<span><b>${lista.length}</b> cards</span><span>Último lead recebido: <b style="color:${dias!=null&&dias>=3?"var(--red)":"inherit"}">${ultTxt}</b></span><span>Na mesa: <b>${brl(S.mtr?.na_mesa)}</b></span>`;
  $("#board").innerHTML=S.etapas.map(e=>{
    const cs=lista.filter(c=>c.etapa_id===e.id);
    return `<div class="col" data-e="${e.id}"><h3>${esc(e.nome)} <span>${cs.length}</span></h3>${cs.map(cardHtml).join("")}</div>`;
  }).join("")||'<div class="card">Nenhuma etapa encontrada. Rode o crm-banco.sql.</div>';
  document.querySelectorAll(".kc").forEach(k=>{
    k.onclick=()=>abrirCard(k.dataset.id);
    k.ondragstart=ev=>{ev.dataTransfer.setData("text/plain",k.dataset.id)};
  });
  document.querySelectorAll(".col").forEach(c=>{
    c.ondragover=ev=>{ev.preventDefault();c.classList.add("over")};
    c.ondragleave=()=>c.classList.remove("over");
    c.ondrop=ev=>{ev.preventDefault();c.classList.remove("over");moverCard(ev.dataTransfer.getData("text/plain"),c.dataset.e)};
  });
}
function cardHtml(c){
  return `<div class="kc" draggable="${podeEditar()}" data-id="${c.id}"><span class="score" title="Pontuação">${c.pontuacao}</span><b>${esc(c.nome)}</b><small>${esc([c.cargo,c.empresa].filter(Boolean).join(" · "))}</small>
  ${c.valor_proposta?`<div class="val">${brl(c.valor_proposta)}</div>`:""}
  <div class="chips">${(c.etiquetas||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}${c.dono_id?`<span class="chip" style="background:#eef2f6;color:#475569">${esc(donoNome(c.dono_id))}</span>`:""}${c.ia_pausada?`<span class="chip" style="background:var(--amber-soft);color:var(--amber)">IA pausada</span>`:""}</div></div>`;
}
async function moverCard(id,etapaId){
  const c=S.cards.find(x=>x.id===id),et=S.etapas.find(e=>e.id===etapaId);
  if(!c||!et||c.etapa_id===etapaId)return;
  if(!podeEditar())return toast("Seu acesso é só de leitura.");
  const extra={};
  if(et.chave==="ganho"){
    const v=await perguntar("Valor fechado (R$)",c.valor_proposta||"");
    if(v===null)return; extra.valor_fechado=Number(String(v).replace(/\./g,"").replace(",","."))||0;
  }
  if(et.chave==="perdido"){
    const m=await perguntar("Motivo da perda (opcional)","");
    if(m===null)return; extra.motivo_perda=m||null;
  }
  const antiga=c.etapa_id;c.etapa_id=etapaId;renderCrm();
  const {error}=await sb.from("cards").update({etapa_id:etapaId,...extra}).eq("id",id);
  if(error){c.etapa_id=antiga;renderCrm();toast("Não deu para mover: "+error.message);return}
  recarregar();
}
function perguntar(titulo,valor){
  return new Promise(res=>{
    abrir(`<h3>${esc(titulo)}</h3><input id="pv" value="${esc(valor)}"><div style="margin-top:12px;display:flex;gap:8px"><button class="btn pri" id="pok">OK</button><button class="btn" id="pno">Cancelar</button></div>`);
    $("#pv").focus();
    $("#pok").onclick=()=>{const v=$("#pv").value;fechar();res(v)};
    $("#pno").onclick=()=>{fechar();res(null)};
  });
}

/* ============ CARD ABERTO ============ */
async function abrirCard(id){
  const c=S.cards.find(x=>x.id===id);if(!c)return;
  const [h,n,r]=await Promise.all([
    sb.from("historico_card").select("*").eq("card_id",id).order("criado_em",{ascending:false}),
    sb.from("notas").select("*").eq("card_id",id).order("criado_em",{ascending:false}),
    sb.from("reunioes").select("*").eq("card_id",id).order("inicio",{ascending:false})
  ]);
  const ed=podeEditar()?"":"disabled";
  const nomeEt=i=>S.etapas.find(e=>e.id===i)?.nome||"—";
  const motivos=(c.pontuacao_motivos||[]);
  abrir(`<div style="display:flex;justify-content:space-between;gap:8px"><div><h2>${esc(c.nome)}</h2><div style="color:var(--mute)">${esc(nomeEt(c.etapa_id))} · criado em ${fdt(c.criado_em)}</div></div><button class="btn" onclick="fechar()">Fechar</button></div>
  <div class="grid">
   <label>Nome<input id="f-nome" value="${esc(c.nome)}" ${ed}></label>
   <label>E-mail<input id="f-email" value="${esc(c.email)}" ${ed}></label>
   <label>Telefone<input id="f-telefone" value="${esc(c.telefone)}" ${ed}></label>
   <label>Cargo<input id="f-cargo" value="${esc(c.cargo)}" ${ed}></label>
   <label>Empresa<input id="f-empresa" value="${esc(c.empresa)}" ${ed}></label>
   <label>Maior dor<input id="f-dor" value="${esc(c.dor)}" ${ed}></label>
   <label>Como capta clientes hoje<input id="f-canal_atual" value="${esc(c.canal_atual)}" ${ed}></label>
   <label>Valor da proposta (R$)<input id="f-valor_proposta" type="number" step="0.01" value="${c.valor_proposta??""}" ${ed}></label>
   <label>Responsável<select id="f-dono_id" ${ed}><option value="">—</option>${S.perfis.filter(p=>p.papel!=="leitura").map(p=>`<option value="${p.id}" ${p.id===c.dono_id?"selected":""}>${esc(p.nome||p.email)}</option>`).join("")}</select></label>
   <label>Próxima ação<input id="f-proxima_acao" value="${esc(c.proxima_acao)}" ${ed}></label>
   <label>Data da próxima ação<input id="f-proxima_acao_em" type="datetime-local" value="${c.proxima_acao_em?new Date(new Date(c.proxima_acao_em)-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):""}" ${ed}></label>
  </div>
  <div class="chips">${(c.etiquetas||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
   <button class="btn pri" id="sv" ${ed}>Salvar</button>
   <button class="btn" id="ag" ${ed}>Agendar reunião</button>
   <button class="btn" id="ia" ${ed}>${c.ia_pausada?"Devolver à IA":"Pausar IA"}</button>
   <button class="btn danger" id="del" ${S.perfil?.papel==="dono"?"":"disabled"}>Excluir</button>
  </div>
  <div class="sec"><h4>Pontuação ${c.pontuacao}/100</h4>${motivos.length?motivos.map(m=>`<div class="pts"><span>${esc(m.motivo||m.m||"")}</span><b>+${esc(m.pontos??m.p??"")}</b></div>`).join(""):'<small style="color:var(--mute)">Sem detalhes de pontuação ainda.</small>'}</div>
  <div class="sec"><h4>Reuniões</h4>${(r.data||[]).map(x=>`<div class="li">${fdt(x.inicio)} · ${esc(donoNome(x.dono_id))} · <b>${esc(x.status)}</b>${x.status==="agendada"&&podeEditar()?` <button class="btn" data-st="realizada" data-r="${x.id}">Realizada</button> <button class="btn" data-st="faltou" data-r="${x.id}">Faltou</button>`:""}</div>`).join("")||'<small style="color:var(--mute)">Nenhuma.</small>'}</div>
  <div class="sec"><h4>Notas</h4><div style="display:flex;gap:6px"><input id="nt" placeholder="Escreva uma nota…" ${ed}><button class="btn" id="nb" ${ed}>Adicionar</button></div>${(n.data||[]).map(x=>`<div class="li">${esc(x.texto)}<br><small>${esc(x.autor)} · ${fdt(x.criado_em)}</small></div>`).join("")}</div>
  <div class="sec"><h4>Histórico</h4>${(h.data||[]).map(x=>`<div class="li">${x.tipo==="criado"?"Card criado":`${esc(nomeEt(x.de_etapa_id))} → <b>${esc(nomeEt(x.para_etapa_id))}</b>`}<br><small>${fdt(x.criado_em)}</small></div>`).join("")}</div>`);
  $("#sv").onclick=()=>salvarCard(c);
  $("#ag").onclick=()=>agendar(c);
  $("#ia").onclick=async()=>{const {error}=await sb.from("cards").update({ia_pausada:!c.ia_pausada,humano_assumiu_em:!c.ia_pausada?new Date().toISOString():null}).eq("id",c.id);if(error)return toast(error.message);fechar();recarregar()};
  $("#nb").onclick=async()=>{const t=$("#nt").value.trim();if(!t)return;const {error}=await sb.from("notas").insert({card_id:c.id,texto:t,autor:"time"});if(error)return toast(error.message);abrirCard(c.id)};
  $("#del").onclick=async()=>{if(!confirm("Excluir este card e todo o histórico dele?"))return;const {error}=await sb.from("cards").delete().eq("id",c.id);if(error)return toast(error.message);fechar();recarregar()};
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{
    const st=b.dataset.st;const {error}=await sb.from("reunioes").update({status:st}).eq("id",b.dataset.r);if(error)return toast(error.message);
    if(st==="realizada"){const e=etapaPorChave("realizada");if(e)await sb.from("cards").update({etapa_id:e.id}).eq("id",c.id)}
    fechar();recarregar();
  });
}
async function salvarCard(c){
  const campos=["nome","email","telefone","cargo","empresa","dor","canal_atual","valor_proposta","dono_id","proxima_acao","proxima_acao_em"];
  const upd={};
  campos.forEach(k=>{
    let v=$("#f-"+k).value;
    if(k==="valor_proposta")v=v===""?null:Number(v);
    else if(k==="proxima_acao_em")v=v?new Date(v).toISOString():null;
    else if(v==="")v=(k==="nome")?c.nome:null;
    const antigo=c[k]??null;
    if(String(v??"")!==String(antigo??"")&&!(k==="proxima_acao_em"&&v&&antigo&&new Date(v).getTime()===new Date(antigo).getTime()))upd[k]=v;
  });
  if(!Object.keys(upd).length){fechar();return}
  if("valor_proposta" in upd&&upd.valor_proposta&&!c.proposta_em){const e=etapaPorChave("proposta");if(e&&etapaOrdem(c.etapa_id)<e.ordem)upd.etapa_id=e.id}
  const {error}=await sb.from("cards").update(upd).eq("id",c.id);
  if(error)return toast(error.code==="23505"?"Já existe um card com este e-mail.":"Erro ao salvar: "+error.message);
  toast("Salvo");fechar();recarregar();
}
const etapaOrdem=id=>S.etapas.find(e=>e.id===id)?.ordem||0;
async function novoCard(){
  if(!podeEditar())return toast("Seu acesso é só de leitura.");
  const nome=await perguntar("Nome do novo lead","");if(!nome)return;
  const e=etapaPorChave("novo")||S.etapas[0];
  const {data,error}=await sb.from("cards").insert({nome,funil_id:e.funil_id,etapa_id:e.id,dono_id:S.perfil?.papel==="closer"?S.me.id:null,origem:"manual"}).select().single();
  if(error)return toast(error.message);
  await recarregar();abrirCard(data.id);
}
async function agendar(c){
  const donos=S.perfis.filter(p=>p.papel!=="leitura");
  abrir(`<h3>Agendar reunião com ${esc(c.nome)}</h3><div class="grid"><label>Data e hora<input id="ag-d" type="datetime-local"></label><label>Responsável<select id="ag-o">${donos.map(p=>`<option value="${p.id}" ${p.id===(c.dono_id||S.me.id)?"selected":""}>${esc(p.nome||p.email)}</option>`).join("")}</select></label></div><div style="display:flex;gap:8px"><button class="btn pri" id="ag-ok">Agendar</button><button class="btn" onclick="fechar()">Cancelar</button></div>`);
  $("#ag-ok").onclick=async()=>{
    const d=$("#ag-d").value;if(!d)return toast("Escolha data e hora.");
    const dono=$("#ag-o").value||null;const e=etapaPorChave("agendada");
    const r1=await sb.from("reunioes").insert({card_id:c.id,dono_id:dono,inicio:new Date(d).toISOString(),origem:"time"});
    if(r1.error)return toast(r1.error.message);
    if(e)await sb.from("cards").update({etapa_id:e.id,dono_id:dono}).eq("id",c.id);
    await sb.from("notas").insert({card_id:c.id,autor:"sistema",tipo:"reuniao",texto:"Reunião agendada para "+fdt(d)});
    fechar();confete();recarregar();
  };
}
function confete(){
  const fr=["Reunião marcada! Pequena vitória, grande caminho.","Mais uma na agenda. Bora!","Agendou! O funil agradece."];
  toast(fr[Math.floor(Math.random()*fr.length)]);
  const cor=["#0b66d6","#06b6d4","#0f9d3a","#f59e0b","#ec4899"];
  for(let i=0;i<70;i++){const d=document.createElement("div");d.className="cf";d.style.left=Math.random()*100+"vw";d.style.background=cor[i%5];d.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
}

/* ============ METAS (funil ideal x real) ============ */
function renderMetas(){
  const m=S.metaMes||{leads:0,quentes:0,agendadas:0,realizadas:0,vendas:0,faturamento:0}, r=S.mtr||{};
  const rows=[["Leads",m.leads,r.leads],["Leads quentes",m.quentes,r.quentes],["Reuniões agendadas",m.agendadas,r.agendadas],["Reuniões realizadas",m.realizadas,r.realizadas],["Vendas",m.vendas,r.vendas]];
  const max=Math.max(1,...rows.map(x=>x[1]||0));
  const mesNome=new Date().toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  const fat=Number(r.faturamento||0),metaF=Number(m.faturamento||0);
  $("#t-metas").innerHTML=`<div class="row2"><div class="card"><h3 style="margin:0">Funil de ${esc(mesNome)}</h3><small style="color:var(--mute)">O contorno é a meta. O verde é o que você já fez no mês.</small>
  <div class="funnel">${rows.map(([n,meta,fez])=>{const w=Math.max(22,(meta||0)/max*100);const p=meta?Math.min(100,(fez||0)/meta*100):0;return `<div class="fr" style="width:${w}%"><i style="width:${p}%"></i><span><em>${n}</em><em>${fez||0} de ${meta||0}</em></span></div>`}).join("")}</div>
  <div style="margin-top:6px"><b>Faturamento</b> · ${brl(fat)} de ${brl(metaF)}</div>
  <div class="fr" style="width:100%;height:26px;margin-top:6px"><i style="width:${metaF?Math.min(100,fat/metaF*100):0}%"></i></div></div>
  <div class="card"><small style="color:var(--mute)">NA MESA AGORA</small><div class="big">${brl(r.na_mesa)}</div><small style="color:var(--mute)">Soma das propostas ainda abertas (nem ganhas nem perdidas). Não depende do mês.</small>
  <hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><small style="color:var(--mute)">PROPOSTAS DO MÊS</small><div class="big" style="font-size:22px">${r.propostas||0}</div></div></div>
  ${S.perfil?.papel==="dono"?`<div class="card" style="margin-top:14px"><b>Metas de ${esc(mesNome)}</b><div class="grid"><label>Faturamento<input id="mt-faturamento" type="number" value="${m.faturamento||0}"></label>${["leads","quentes","agendadas","realizadas","vendas"].map(k=>`<label>${k}<input id="mt-${k}" type="number" value="${m[k]||0}"></label>`).join("")}</div><button class="btn pri" id="mt-sv">Salvar metas</button></div>`:""}`;
  const b=$("#mt-sv");if(b)b.onclick=async()=>{
    const mes=new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10);
    const o={mes};["faturamento","leads","quentes","agendadas","realizadas","vendas"].forEach(k=>o[k]=Number($("#mt-"+k).value)||0);
    const {error}=await sb.from("metas_mes").upsert(o);if(error)return toast(error.message);toast("Metas salvas");recarregar();
  };
}

/* ============ WHATSAPP ============ */
function renderWa(){
  const por={};S.msgs.forEach(m=>{(por[m.card_id||m.telefone]??=[]).push(m)});
  const chaves=Object.keys(por).sort((a,b)=>new Date(por[b].at(-1).criado_em)-new Date(por[a].at(-1).criado_em));
  if(!S.waCard||!por[S.waCard])S.waCard=chaves[0]||null;
  const nomeDe=k=>{const c=S.cards.find(x=>x.id===k);return c?c.nome:por[k][0].telefone};
  const atual=S.waCard?por[S.waCard]:[];
  const card=S.cards.find(x=>x.id===S.waCard);
  $("#t-wa").innerHTML=`<div class="warn">WhatsApp ainda não conectado: a leitura aparece aqui assim que a Evolution API estiver ligada. O envio por esta tela fica ativo nessa etapa.</div>
  <div class="wa"><div class="card wl" style="padding:0">${chaves.map(k=>`<div class="wi ${k===S.waCard?"on":""}" data-k="${esc(k)}"><b>${esc(nomeDe(k))}</b><small>${esc(por[k].at(-1).texto||"")}</small></div>`).join("")||'<div style="padding:14px;color:var(--mute)">Nenhuma conversa ainda.</div>'}</div>
  <div class="card">${S.waCard?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>${esc(nomeDe(S.waCard))}</b>${card?`<span><button class="btn" id="wa-ia" ${podeEditar()?"":"disabled"}>${card.ia_pausada?"Devolver à IA":"Assumir conversa"}</button> <button class="btn" id="wa-abre">Abrir card</button></span>`:""}</div>
  <div class="chat">${atual.map(m=>`<div class="m ${m.direcao==="entrada"?"in":"out"}">${esc(m.texto)}<small>${esc(m.autor)} · ${fdt(m.criado_em)}</small></div>`).join("")}</div>
  <div style="display:flex;gap:6px;margin-top:8px"><input placeholder="Envio ativa quando a Evolution API estiver conectada" disabled><button class="btn pri" disabled>Enviar</button></div>`:'<div style="color:var(--mute)">Selecione uma conversa.</div>'}</div></div>`;
  document.querySelectorAll(".wi").forEach(w=>w.onclick=()=>{S.waCard=w.dataset.k;renderWa()});
  const a=$("#wa-ia");if(a)a.onclick=async()=>{const {error}=await sb.from("cards").update({ia_pausada:!card.ia_pausada,humano_assumiu_em:!card.ia_pausada?new Date().toISOString():null}).eq("id",card.id);if(error)return toast(error.message);recarregar()};
  const o=$("#wa-abre");if(o)o.onclick=()=>abrirCard(card.id);
  const ch=document.querySelector(".chat");if(ch)ch.scrollTop=ch.scrollHeight;
}

/* ============ SINO (calculado, guarda só o que foi lido) ============ */
function avisos(){
  const hoje=new Date().toDateString(),lista=[];
  const meu=id=>{const c=S.cards.find(x=>x.id===id);return c&&c.dono_id===S.me.id};
  const nomeCard=id=>S.cards.find(x=>x.id===id)?.nome||"Lead";
  S.msgs.filter(m=>m.direcao==="entrada"&&!m.lida).forEach(m=>lista.push({k:"msg:"+m.id,t:`Mensagem nova de ${nomeCard(m.card_id)}`,minha:meu(m.card_id),quando:m.criado_em}));
  S.hist.forEach(h=>lista.push({k:"hist:"+h.id,t:`${nomeCard(h.card_id)} foi para ${S.etapas.find(e=>e.id===h.para_etapa_id)?.nome||"outra etapa"}`,minha:meu(h.card_id),quando:h.criado_em}));
  S.reunioes.filter(r=>r.status==="agendada"&&new Date(r.inicio).toDateString()===hoje).forEach(r=>lista.push({k:"reun:"+r.id,t:`Reunião hoje às ${new Date(r.inicio).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})} com ${nomeCard(r.card_id)}`,minha:r.dono_id===S.me.id,quando:r.inicio}));
  return lista.sort((a,b)=>new Date(b.quando)-new Date(a.quando));
}
function renderBell(){
  const todos=avisos(),vis=S.bellTab==="minhas"?todos.filter(a=>a.minha):todos;
  const nao=todos.filter(a=>!S.lidos.has(a.k)).length;
  $("#bn").textContent=nao;$("#bn").classList.toggle("hide",!nao);
  $("#bellbox").innerHTML=`<div class="tabs2"><button data-t="geral" class="${S.bellTab==="geral"?"on":""}">Geral</button><button data-t="minhas" class="${S.bellTab==="minhas"?"on":""}">Minhas</button><button id="lerTudo" style="margin-left:auto">Marcar lidos</button></div>${vis.slice(0,30).map(a=>`<div class="av ${S.lidos.has(a.k)?"lido":""}"><span>${esc(a.t)}</span><small>${fdt(a.quando)}</small></div>`).join("")||'<div style="padding:8px;color:var(--mute)">Nada por aqui.</div>'}`;
  document.querySelectorAll(".tabs2 [data-t]").forEach(b=>b.onclick=()=>{S.bellTab=b.dataset.t;renderBell()});
  $("#lerTudo").onclick=async()=>{
    const novos=vis.filter(a=>!S.lidos.has(a.k)).map(a=>({user_id:S.me.id,chave:a.k}));
    if(novos.length){await sb.from("avisos_lidos").upsert(novos);novos.forEach(n=>S.lidos.add(n.chave))}
    renderBell();
  };
}

/* ============ CHECKLIST DIÁRIO ============ */
const CAMPOS_PADRAO=["Conexões enviadas","Mensagens","Follow-ups"];
const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
async function renderChk(){
  const hoje=ymd(new Date());
  const [m,d]=await Promise.all([sb.from("checklist_metas").select("*").eq("user_id",S.me.id),sb.from("checklist_diario").select("*").eq("user_id",S.me.id).gte("dia",ymd(new Date(Date.now()-14*864e5))).order("dia",{ascending:false})]);
  const metas=Object.fromEntries((m.data||[]).map(x=>[x.campo,x.meta]));
  const campos=[...new Set([...CAMPOS_PADRAO,...Object.keys(metas)])];
  const val=(dia,c)=>(d.data||[]).find(x=>x.dia===dia&&x.campo===c)?.valor??"";
  const dias=[...new Set((d.data||[]).map(x=>x.dia))].filter(x=>x!==hoje);
  $("#t-chk").innerHTML=`<div class="card"><h3 style="margin-top:0">Checklist de hoje</h3><div class="grid">${campos.map(c=>`<label>${esc(c)} <small>(meta ${metas[c]||0})</small><input type="number" min="0" data-c="${esc(c)}" value="${val(hoje,c)}"></label>`).join("")}</div>
  <button class="btn pri" id="ck-sv">Salvar o dia</button></div>
  <div class="card" style="margin-top:14px"><h3 style="margin-top:0">Metas diárias</h3><div class="grid">${campos.map(c=>`<label>${esc(c)}<input type="number" min="0" data-mc="${esc(c)}" value="${metas[c]||0}"></label>`).join("")}</div><button class="btn" id="mk-sv">Salvar metas</button></div>
  <div class="card" style="margin-top:14px"><h3 style="margin-top:0">Últimos dias</h3><table><tr><th>Dia</th>${campos.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${dias.map(dia=>`<tr><td>${dia.split("-").reverse().join("/")}</td>${campos.map(c=>{const v=val(dia,c),ok=!metas[c]||Number(v||0)>=metas[c];return `<td style="color:${ok?"var(--g)":"var(--mute)"}">${v===""?0:v}</td>`}).join("")}</tr>`).join("")||'<tr><td colspan="9">Sem lançamentos ainda.</td></tr>'}</table></div>`;
  $("#ck-sv").onclick=async()=>{
    const rows=[...document.querySelectorAll("[data-c]")].map(i=>({user_id:S.me.id,dia:hoje,campo:i.dataset.c,valor:Number(i.value)||0}));
    const {error}=await sb.from("checklist_diario").upsert(rows);if(error)return toast(error.message);toast("Dia salvo");
  };
  $("#mk-sv").onclick=async()=>{
    const rows=[...document.querySelectorAll("[data-mc]")].map(i=>({user_id:S.me.id,campo:i.dataset.mc,meta:Number(i.value)||0}));
    const {error}=await sb.from("checklist_metas").upsert(rows);if(error)return toast(error.message);toast("Metas salvas");renderChk();
  };
}
async function checarOntem(){
  const chave="ck-aviso:"+ymd(new Date());
  try{if(localStorage.getItem(chave))return}catch(_){}
  const ontem=ymd(new Date(Date.now()-864e5));
  const [m,d]=await Promise.all([sb.from("checklist_metas").select("*").eq("user_id",S.me.id),sb.from("checklist_diario").select("*").eq("user_id",S.me.id).eq("dia",ontem)]);
  const falhou=(m.data||[]).filter(x=>x.meta>0&&((d.data||[]).find(v=>v.campo===x.campo)?.valor||0)<x.meta);
  if(!falhou.length)return;
  abrir(`<h3>Bom dia! Ontem ficou faltando um pouco</h3><p>${falhou.map(f=>esc(f.campo)).join(", ")}: abaixo da meta. Sem drama, vamos ajustar hoje.</p><button class="btn pri" id="ok-ck">Ok, levar ao checklist</button>`);
  $("#ok-ck").onclick=()=>{try{localStorage.setItem(chave,"1")}catch(_){}fechar();goTab("chk")};
}

/* ============ TOUR DE NOVIDADES ============ */
const PASSOS=[
 {t:"Funil em colunas",d:"Arraste um card de coluna e o histórico se escreve sozinho. Mágica sem varinha.",tab:"crm"},
 {t:"Metas do mês",d:"O contorno é a meta, o verde é o que você já fez. Sem vermelho, sem drama.",tab:"metas"},
 {t:"WhatsApp aqui dentro",d:"Acompanhe as conversas sem sair do CRM.",tab:"wa"},
 {t:"Checklist diário",d:"Lance seus números do dia. O sistema cobra por você, sem barulho no grupo.",tab:"chk"}
];
async function checarTour(){
  const {data}=await sb.from("novidades_vistas").select("versao").eq("user_id",S.me.id).eq("versao",VERSAO);
  if(data&&data.length)return;
  let i=0;
  const mostra=()=>{
    const p=PASSOS[i];
    abrir(`<small style="color:var(--mute)">NOVIDADE ${i+1} DE ${PASSOS.length} · versão ${VERSAO}</small><h3 style="margin:4px 0">${esc(p.t)}</h3><p>${esc(p.d)}</p><div style="display:flex;gap:8px"><button class="btn" id="tl">Me leva lá</button><button class="btn pri" id="tn">${i<PASSOS.length-1?"Próxima":"Fechar"}</button></div>`);
    $("#tl").onclick=()=>{fim();goTab(p.tab)};
    $("#tn").onclick=()=>{if(i<PASSOS.length-1){i++;mostra()}else fim()};
  };
  const fim=async()=>{fechar();await sb.from("novidades_vistas").upsert({user_id:S.me.id,versao:VERSAO})};
  mostra();
}
</script>
