<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico de Demanda B2B</title>
<style>
:root{--azul:#0b2a5b;--laranja:#ff7a1a;--verde:#12a36b;--cinza:#f4f6fa;--texto:#14213d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--cinza);color:var(--texto)}
header{background:var(--azul);color:#fff;padding:14px;text-align:center;font-weight:700;letter-spacing:.3px}
header span{color:var(--laranja)}
main{max-width:560px;margin:0 auto;padding:24px 16px 120px}
.barra{height:6px;background:#dde3ee;border-radius:9px;overflow:hidden;margin:8px 0 4px}
.barra i{display:block;height:100%;width:0;background:var(--laranja);transition:width .3s}
.voltar{background:none;border:0;color:#5b6b8a;cursor:pointer;font-size:14px;padding:4px 0}
h1{font-size:26px;line-height:1.2;margin:28px 0 10px}
h2{font-size:22px;margin:36px 0 18px}
p{color:#4a5876;line-height:1.5}
.op{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #d5dcea;border-radius:12px;padding:15px 16px;margin:10px 0;font-size:16px;cursor:pointer;color:var(--texto)}
.op:hover{border-color:var(--laranja)}
.btn{background:var(--laranja);color:#fff;border:0;border-radius:12px;padding:15px 22px;font-size:17px;font-weight:700;cursor:pointer;width:100%;margin-top:14px}
input{width:100%;padding:14px;border:1.5px solid #d5dcea;border-radius:12px;font-size:16px;margin:7px 0}
.tag{display:inline-block;background:#e4f6ee;color:var(--verde);border-radius:99px;padding:5px 11px;font-size:12px;margin:3px 3px 0 0}
.aviso{font-size:12px;color:#7a88a6;text-align:center;margin-top:14px}
#painel{position:fixed;left:0;right:0;bottom:0;background:#0a1630;color:#cfe3ff;font:12px/1.5 ui-monospace,Consolas,monospace;padding:10px 14px;max-height:34vh;overflow:auto;display:none;border-top:3px solid var(--laranja)}
#painel b{color:var(--laranja)} #painel .ok{color:#6ee7a8} #painel .no{color:#ff9b9b}
</style>
</head>
<body>
<header>Zayvon <span>Demanda Infinita</span></header>
<main id="app"></main>
<div id="painel"></div>

<script>
/* ===== Configuração (trocar por cliente) ===== */
const CFG = {
  marca: "Zayvon",
  titulo: "Sua empresa B2B tem uma máquina de demanda ou depende de indicação?",
  sub: "Responda 5 perguntas rápidas e veja se faz sentido conversarmos.",
  // Para o envio real: colocar aqui o endereço do seu servidor (nunca a URL do webhook com token).
  ENVIO_URL: null
};
// disq:true = lead que NÃO é o perfil: vai para a tela "ainda não é o momento" e nada é enviado.
const PERGUNTAS = [
  {k:"cargo", t:"Qual é o seu cargo?", o:[
    ["Sócio / Fundador"],["Diretor / Head comercial"],["Gerente"],["Analista / Assistente",true],["Estudante / Estagiário",true]]},
  {k:"setor", t:"Qual é o setor da sua empresa?", o:[
    ["Tecnologia / Software"],["Indústria"],["Serviços profissionais"],["Saúde"],["Outro"]]},
  {k:"faturamento", t:"Quanto a empresa fatura por mês?", o:[
    ["Até R$ 30 mil",true],["R$ 30 a 100 mil"],["R$ 100 a 500 mil"],["Mais de R$ 500 mil"]]},
  {k:"time", t:"Como é o seu time comercial hoje?", o:[
    ["Só eu vendo"],["1 a 3 vendedores"],["4 a 10 vendedores"],["Mais de 10 vendedores"]]},
  {k:"urgencia", t:"Quando quer começar a gerar mais reuniões?", o:[
    ["Neste mês"],["Em até 3 meses"],["Só estou pesquisando",true]]}
];

const app=document.getElementById("app"), painel=document.getElementById("painel");
const DEMO = new URLSearchParams(location.search).has("demo");
if(DEMO) painel.style.display="block";
let passo=-1, resp={};

function log(msg,cls=""){ if(!DEMO) return;
  const h=new Date().toLocaleTimeString("pt-BR");
  painel.insertAdjacentHTML("beforeend",`<div class="${cls}">[${h}] ${msg}</div>`);
  painel.scrollTop=painel.scrollHeight; }

function barra(){ const p=Math.round(((passo+1)/(PERGUNTAS.length+1))*100);
  return `<div class="barra"><i style="width:${p}%"></i></div><button class="voltar" onclick="voltar()">← Voltar</button>`; }

function inicio(){
  passo=-1; resp={};
  app.innerHTML=`<span class="tag">Diagnóstico gratuito</span><span class="tag">Menos de 1 minuto</span>
  <h1>${CFG.titulo}</h1><p>${CFG.sub}</p>
  <button class="btn" onclick="avancar()">Começar agora</button>`;
  log("<b>página vista</b> → evento PageView enviado ao Meta e ao Google");
}
function avancar(){ passo++; tela(); }
function voltar(){ if(passo<=0){inicio();return;} passo--; tela(); }

function tela(){
  if(passo>=PERGUNTAS.length) return cadastro();
  const q=PERGUNTAS[passo];
  app.innerHTML=barra()+`<h2>${q.t}</h2>`+q.o.map((o,i)=>`<button class="op" onclick="escolher(${i})">${o[0]}</button>`).join("");
}
function escolher(i){
  const q=PERGUNTAS[passo], o=q.o[i];
  resp[q.k]=o[0];
  log(`resposta: <b>${q.k}</b> = ${o[0]}${o[1]?' <span class="no">(fora do perfil)</span>':''}`);
  if(o[1]) return descartar(q.k,o[0]);
  avancar();
}
function descartar(k,v){
  app.innerHTML=`<h1>Ainda não é o momento</h1>
  <p>Pelo que você respondeu, o nosso trabalho ainda não é o melhor caminho agora. Sem problema: quando a empresa estiver num ponto mais avançado, é só voltar.</p>
  <button class="btn" onclick="inicio()">Refazer o diagnóstico</button>`;
  log(`<span class="no">lead descartado (${k}: ${v})</span> → nenhum dado enviado ao CRM, ao Meta nem ao Google. Anúncio não aprende com lead ruim.`);
}
function cadastro(){
  app.innerHTML=barra()+`<h2>Quase lá! Preencha para ver o resultado</h2>
  <iframe id="form-5657b8921dbc010b78" style="width:100%;min-height:520px;border:0" loading="lazy"></iframe>`;
  // Formulário do próprio CRM (Yollo, E-mail Marketing), embutido no quiz.
  var q=window.location.search.replace(/^\?/,'');
  document.getElementById('form-5657b8921dbc010b78').src='https://mail.sistemacrmcomia.com.br/api/v1/email-mkt/f/5657b8921dbc010b78?embed=1'+(q?'&'+q:'');
  log("formulário do CRM carregado dentro do quiz (lead qualificado)");
}
// Quando o formulário do CRM é enviado, ele avisa a página; daí disparamos Meta e Google.
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.type!=='form_submitted'||d.form!=='5657b8921dbc010b78') return;
  if(d.fb&&window.fbq) fbq('track',d.fb);
  if(d.gtag&&window.gtag) gtag('event','conversion',{send_to:d.gtag});
  log("<b>cadastro enviado ao CRM</b> → negociação criada; eventos Meta/Google disparados","ok");
  log("→ depois: SDR atende → etapa muda → evento <b>Conversão offline</b> com o valor da venda","ok");
});
inicio();
</script>
</body>
</html>
